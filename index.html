<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AutomaLab</title>
        <link rel="icon" type="image/png" href="assets/icon.png"/>

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/canvas.css">
        <link rel="stylesheet" href="css/toolbar.css">
        <link rel="stylesheet" href="css/sidebar.css">
        <link rel="stylesheet" href="css/context-modal.css">
    </head>

    <body>
        <div class="container">
            <header>
                <h1>AutomaLab</h1>
                <div class="header-info">
                    <span id="state-count">Estados: 0</span>
                    <span id="transition-count">Transições: 0</span>
                </div>
            </header>

            <div class="main">
                <!-- TOOLBAR -->
                <div class="toolbar" id="toolbar">
                    <button class="toolbar-btn" id="select-state-btn">Selecionar</button>
                    <button class="toolbar-btn" id="add-state-btn">Adicionar Estado</button>
                    <button class="toolbar-btn" id="add-transition-btn">Adicionar Transição</button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn" id="save-btn">Exportar</button>
                    <button class="toolbar-btn" id="load-btn">Importar</button>
                    <button class="toolbar-btn" id="clear-btn">Limpar Tudo</button>
                </div>

                <!-- CANVAS -->
                <div class="workspace">
                    <svg class="canvas" id="canvas">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <polygon points="0 0, 10 3, 0 6" />
                            </marker>
                        </defs>
                    </svg>
                </div>

                <!-- SIDEBAR -->
                <div class="sidebar">
                    <div class="sidebar-section">
                        <div class="sidebar-title">Propriedades do Autômato</div>
                        <div class="sidebar-item">
                            <label class="sidebar-label">Tipo</label>
                            <select name="automata-type" id="automata-type">
                                <option value="dfa">AFD (Determinístico)</option>
                                <option value="nfa">AFND (Não-determinístico)</option>
                            </select>
                        </div>

                        <div class="sidebar-item">
                            <label class="sidebar-label">Nome</label>
                            <input type="text" id="automata-name" placeholder="Meu Autômato" value="Automato 1">
                        </div>
                    </div>

                    <div class="sidebar-section">
                        <div class="sidebar-title">Estado Selecionado</div>
                        <div id="selected-state">Selecione um estado</div>
                    </div>

                    <div class="sidebar-section">
                        <div class="sidebar-title">Ações Rápidas</div>
                        <button class="btn" id="btn-export">⬇️ Exportar JSON</button>
                        <button class="btn secondary" id="btn-import">⬆️ Importar JSON</button>
                        <button class="btn danger" id="btn-delete-all">❌ Deletar Tudo</button>
                    </div>

                    <div class="simulator-panel">
                        <div class="sidebar-title">Simulador</div>
                        <div class="sim-input-group">
                            <input type="text" id="simInput" placeholder="Digite a cadeia (ex: aabb)" value="">
                            <button class="btn" id="btnSimulate" style="min-width: 80px;">▶ Simular</button>
                        </div>
                        <div id="simOutput" class="simulator-output">Teste uma cadeia</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTEXT MODAL OVERLAY -->
        <div class="context-overlay" id="context-overlay"></div>

        <!-- CONTEXT MODAL -->
        <div class="context-modal" id="context-modal">
            <!-- HEADER -->
            <div class="context-modal-header">
                <h3 class="context-modal-title">Propriedades do Estado</h3>
                <button class="context-modal-close" id="context-modal-close">&times;</button>
            </div>
            <!-- BODY -->
            <div class="context-modal-body">
                <!-- INFO: Estado Selecionado -->
                <div class="context-selected-info" id="context-selected-info">
                    <strong id="context-state-name">Estado: q0</strong>
                    <span id="context-state-status">Novo estado</span>
                </div>

                <!-- SEÇÃO 1: Nome do Estado -->
                <div class="context-section">
                    <div class="context-section-title">Nome</div>
                    <div class="context-item">
                        <label class="context-item-label">Identificador</label>
                        <input type="text" id="context-state-input-name" class="context-item-input" placeholder="q0, q1, q2...">
                    </div>
                </div>

                <!-- SEÇÃO 2: Tipo de Estado -->
                <div class="context-section">
                    <div class="context-section-title">Tipo de Estado</div>

                    <!-- Estado Inicial -->
                    <div class="context-item">
                        <label class="context-item-checkbox">
                            <input type="checkbox" name="context-state-initial" id="context-state-initial">
                            <span>Marcar como Estado Inicial</span>
                        </label>
                        <div class="context-item-initial" id="context-item-initial-hint" style="display: none;">
                            Estado Inicial do Autômato
                        </div>
                    </div>

                    <!-- Estado de Aceitação -->
                    <div class="context-item">
                        <label class="context-item-checkbox">
                            <input type="checkbox" id="context-state-accept">
                            <span>Marcar como Estado de Aceitação</span>
                        </label>
                        <div class="context-item-accept" id="context-accept-hint" style="display: none;">
                            Estado final (aceitação)
                        </div>
                    </div>

                </div>

                <!-- SEÇÃO 3: Ações -->
                <div class="context-section">
                    <div class="context-section-title">Ações</div>
                    
                    <!-- Deletar Estado -->
                    <button class="context-action-btn danger" id="context-delete-state">
                        <span class="context-action-icon">🗑️</span>
                        <span>Deletar Este Estado</span>
                    </button>

                    <!-- Limpar Transições -->
                    <button class="context-action-btn" id="context-clear-transitions">
                        <span class="context-action-icon">🔄</span>
                        <span>Limpar Transições</span>
                    </button>
                </div>

            </div>
            <!-- FOOTER -->
            <div class="context-modal-footer">
                <button class="btn secondary" id="context-modal-cancel">Cancelar</button>
                <button class="btn primary" id="context-modal-save">Salvar</button>
            </div>

        </div>

        <!-- SCRIPTS -->
        <script src="js/utils/constants.js"></script>
        <script src="js/utils/helpers.js"></script>
        
        <script src="js/canvas/stateNode.js"></script>
        <script src="js/canvas/transitionEdge.js"></script>
        <script src="js/canvas/canvas.js"></script>
        
        <script src="js/simulator/simulator.js"></script>
        
        <script src="js/storage/jsonManager.js"></script>
        
        <script src="js/ui/toolbar.js"></script>
        <script src="js/ui/contextModal.js"></script>
        
        <script src="js/main.js"></script>

    </body>
</html>
