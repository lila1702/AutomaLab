<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AutomaLab</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" type="css/canvas.css">
        <link rel="icon" type="image/png" href="assets/icon.png"/>
    </head>

    <body>
        <div class="container">
            <header>
                <h1>AutomaLab</h1>
                <div class="header-info">
                    <span id="stateCount">Estados: 0</span>
                    <span id="transitionCount">Transições: 0</span>
                </div>
            </header>

            <div class="main">
                <div class="toolbar" id="toolbar">
                    <button class="toolbarBtn" id="addStateBtn">Adicionar Estado</button>
                    <button class="toolbarBtn" id="addTransitionBtn">Adicionar Transição</button>
                    <button class="toolbarBtn" id="simulateBtn">Simular</button>
                </div>
            </div>

        </div>
    </body>

</html>
